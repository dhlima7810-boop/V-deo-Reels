<body>
<script src="/__spec.js"></script>
<script src="/engine/ms.js"></script>
<script>
/* 4 DIAS PRA CONQUISTAR A CRUSH — Dia 1 de 4 (55 s, 9:16). Narrated by Davi (assets/narracao.wav, timings in
   assets/narracao.json). No audience choice: the story just happens and ends on a cliffhanger.
   Persistent HUD from scene 2: DIA 1/4 + CHANCE COM A BIA meter. Captions carry the key words for muted autoplay. */
MS.boot(C => {
  const W = C.W, H = C.H, hash = MS.hash;
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), sm = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
  const INK = '#1b1b1b';
  const DAVI = { skin: '#e0a477', hair: 'messy', hairC: '#3b2416', top: '#3a7bd5', topType: 'hoodie' };
  const BIA = { skin: '#a86b45', hair: 'pony', hairC: '#2a160d', top: '#6f9be0', topType: 'jacket' };
  const KAI = { skin: '#7a4a2c', hair: 'cap', hairC: '#151515', top: '#e63946', topType: 'jersey', chain: true };

  // ───────── characters: bust builder (original designs). viewBox 0 0 300 420
  function person(base, o = {}) {
    o = Object.assign({}, base, o);
    const ex = o.expr || 'neutral', lk = o.look || [0, 0], S = o.skin, HC = o.hairC;
    let torso = `<path d="M34 420 Q34 316 150 304 Q266 316 266 420 Z" fill="${o.top}"/>`;
    if (o.topType === 'hoodie') torso += `<path d="M96 306 Q150 280 204 306 Q150 346 96 306 Z" fill="#2b5fae"/><path d="M136 330 v46 M164 330 v46" fill="none" stroke-width="5"/><path d="M96 396 h108" fill="none" stroke-width="5" opacity=".5"/>`;
    if (o.topType === 'jacket') torso += `<path d="M124 310 L150 372 L176 310 Z" fill="#fff"/><path d="M150 312 L112 420 M150 312 L188 420" fill="none" stroke-width="6"/><circle cx="206" cy="372" r="7" fill="#f4c542"/>`;
    if (o.topType === 'jersey') torso += `<path d="M120 308 Q150 340 180 308" fill="none"/><text x="150" y="404" text-anchor="middle" font-family="Anton" font-size="64" fill="#fff" stroke="${INK}" stroke-width="4">7</text>`;
    if (o.chain) torso += `<path d="M112 312 Q150 366 188 312" fill="none" stroke="#ffd23f" stroke-width="7"/><path d="M112 312 Q150 366 188 312" fill="none" stroke="${INK}" stroke-width="2" stroke-dasharray="4 8"/>`;
    const neck = `<rect x="128" y="232" width="44" height="84" fill="${S}"/>`;
    if (o.back) {
      return `<svg viewBox="0 0 300 420" width="300" height="420" xmlns="http://www.w3.org/2000/svg"><g stroke="${INK}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
        ${torso.replace(/<path d="M124 310[^>]*>/, '')}${neck}
        <ellipse cx="72" cy="176" rx="15" ry="20" fill="${S}"/><ellipse cx="228" cy="176" rx="15" ry="20" fill="${S}"/>
        <ellipse cx="150" cy="166" rx="80" ry="88" fill="${HC}"/>
        <path d="M134 116 Q112 230 150 330 Q190 230 166 116 Z" fill="${HC}"/><circle cx="150" cy="112" r="16" fill="#ff5c8a"/>
        <path d="M110 120 Q150 100 190 120 M104 170 Q150 150 196 170" fill="none" stroke="#4a2c1d" stroke-width="5"/></g></svg>`;
    }
    const brows = { neutral: ['M100 134 q20 -8 40 0', 'M160 134 q20 -8 40 0'], happy: ['M100 128 q20 -14 40 -2', 'M160 126 q20 -12 40 2'], smile: ['M100 130 q20 -12 40 -2', 'M160 128 q20 -10 40 2'],
      sad: ['M100 140 L140 128', 'M160 128 L200 140'], wow: ['M100 120 q20 -14 40 -2', 'M160 118 q20 -12 40 2'], smug: ['M100 136 L140 132', 'M160 124 q20 -6 40 4'], nervous: ['M100 136 L140 128', 'M160 128 L200 136'] }[ex];
    const mouth = { neutral: '<path d="M132 228 q18 8 36 0" fill="none"/>', happy: '<path d="M118 218 q32 44 64 0 z" fill="#7a1f1f"/><path d="M126 220 h48" stroke="#fff" stroke-width="6"/>',
      smile: '<path d="M126 222 q24 22 48 0" fill="none"/>', sad: '<path d="M130 238 q20 -16 40 0" fill="none"/>', wow: '<ellipse cx="150" cy="232" rx="14" ry="18" fill="#7a1f1f"/>',
      smug: '<path d="M128 228 q24 10 46 -8" fill="none"/>', nervous: '<path d="M124 232 q8 -8 16 0 t16 0 t16 0 t10 -2" fill="none"/>' }[ex];
    let hairBack = '', hairFront = '';
    if (o.hair === 'messy') hairFront = `<path d="M70 190 Q58 96 150 84 Q244 92 230 190 Q222 150 204 150 Q196 122 172 138 Q160 112 140 136 Q122 116 110 146 Q86 136 82 168 Z M96 108 L82 64 L124 92 Z M140 88 L150 40 L172 86 Z M190 96 L226 62 L216 112 Z" fill="${HC}"/>`;
    if (o.hair === 'pony') { hairBack = `<path d="M212 120 Q318 150 282 316 Q262 232 222 214 Z" fill="${HC}"/><circle cx="222" cy="122" r="17" fill="#ff5c8a"/>`;
      hairFront = `<path d="M68 200 Q52 82 150 78 Q248 82 232 200 Q226 136 196 118 Q150 150 96 126 Q74 150 68 200 Z" fill="${HC}"/>`; }
    if (o.hair === 'cap') hairFront = `<path d="M72 196 Q70 150 84 136 L216 136 Q230 150 228 196 Q220 168 210 166 L90 166 Q80 168 72 196 Z" fill="${HC}"/>
      <path d="M72 150 Q78 70 150 66 Q222 70 228 150 Z" fill="#e63946"/><path d="M74 146 Q160 126 262 142 Q276 162 226 166 L74 160 Z" fill="#b51f2c"/><circle cx="150" cy="70" r="7" fill="#b51f2c"/><path d="M128 112 h44" stroke="#fff" stroke-width="8"/>`;
    const lids = ex === 'smug' ? `<path d="M100 160 h40 M160 160 h40" stroke="${S}" stroke-width="18"/><path d="M100 168 h40 M160 168 h40" stroke-width="6"/>` : '';
    const blush = (o.blush || ex === 'smile') ? `<ellipse cx="104" cy="212" rx="16" ry="9" fill="#ff7a8a" opacity=".6" stroke="none"/><ellipse cx="196" cy="212" rx="16" ry="9" fill="#ff7a8a" opacity=".6" stroke="none"/>` : '';
    const sweat = ex === 'nervous' ? `<path d="M226 122 q14 22 0 30 q-14 -8 0 -30 z" fill="#8fd3ff" stroke-width="4"/>` : '';
    const eyes = o.hearts
      ? `<path d="M120 186 l-18 -18 a10 10 0 0 1 18 -12 a10 10 0 0 1 18 12 z M180 186 l-18 -18 a10 10 0 0 1 18 -12 a10 10 0 0 1 18 12 z" fill="#ff2e63" stroke-width="5"/>`
      : `<g class="eyes" style="transform-box:fill-box;transform-origin:center"><ellipse cx="120" cy="174" rx="18" ry="21" fill="#fff"/><ellipse cx="180" cy="174" rx="18" ry="21" fill="#fff"/>
        <circle cx="${122 + lk[0]}" cy="${178 + lk[1]}" r="8.5" fill="${INK}" stroke="none"/><circle cx="${182 + lk[0]}" cy="${178 + lk[1]}" r="8.5" fill="${INK}" stroke="none"/></g>${lids}`;
    return `<svg viewBox="0 0 300 420" width="300" height="420" xmlns="http://www.w3.org/2000/svg"><g stroke="${INK}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      ${hairBack}${torso}${neck}
      <ellipse cx="72" cy="178" rx="16" ry="21" fill="${S}"/><ellipse cx="228" cy="178" rx="16" ry="21" fill="${S}"/>
      <ellipse cx="150" cy="170" rx="80" ry="86" fill="${S}"/>
      ${hairFront}${eyes}
      <path d="${brows[0]}" fill="none" stroke-width="8"/><path d="${brows[1]}" fill="none" stroke-width="8"/>
      <path d="M150 186 q-9 20 4 24" fill="none" stroke-width="5"/>${blush}${mouth}${sweat}
    </g></svg>`;
  }
  // place a bust (width px) and return {node, svg}
  const bust = (s, base, o, w, x, y, layer) => { const n = s.el(`<div style="width:${w}px">${person(base, o)}</div>`, { space: 'frame', x, y, anchor: 'bottom', layer });
    const sv = n.querySelector('svg'); sv.setAttribute('width', w); sv.setAttribute('height', w * 1.4); return n; };
  const blink = (node, seed) => { const e = node.querySelector('.eyes'); return lt => { if (!e) return; const k = (lt + seed) % 3.3; e.style.transform = k < .12 ? 'scaleY(.1)' : ''; }; };
  const full = (s, html, depth = .6, name = 'bg') => s.el(`<div style="width:${W}px;height:${H}px;overflow:hidden;position:relative">${html}</div>`, { space: 'frame', x: 0, y: 0, anchor: 'top-left', layer: s.layer(depth, name) });
  const frameSvg = inner => `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg"><g stroke="${INK}" stroke-width="7" stroke-linejoin="round">${inner}</g></svg>`;
  const classroom = (light = 1) => frameSvg(`<rect x="-10" y="-10" width="${W + 20}" height="${H + 20}" fill="${light ? '#ffe6c4' : '#e9cfa9'}" stroke="none"/>
    <rect x="90" y="360" width="900" height="470" rx="18" fill="#2f6b4f" stroke-width="14"/><rect x="90" y="830" width="900" height="26" fill="#a0703f"/>
    <text x="540" y="560" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="88" fill="#f4f4ec" stroke="none">x² + 5x + 6 = 0</text>
    <text x="300" y="720" font-family="Fredoka" font-size="54" fill="#f4f4ec" opacity=".8" stroke="none">Δ = b² − 4ac</text>
    <circle cx="930" cy="230" r="70" fill="#fff"/><path d="M930 230 v-44 M930 230 l30 16" fill="none" stroke-width="8"/>
    <rect x="-10" y="1180" width="${W + 20}" height="800" fill="#c99a68"/><path d="M-10 1180 h${W + 20}" stroke-width="10"/>`);
  const desk = (x, y, w) => `<rect x="${x - w / 2}" y="${y}" width="${w}" height="${w * .22}" rx="10" fill="#d9a066"/><rect x="${x - w / 2 + 20}" y="${y + w * .22}" width="16" height="${w * .3}" fill="#6b6b78"/><rect x="${x + w / 2 - 36}" y="${y + w * .22}" width="16" height="${w * .3}" fill="#6b6b78"/>`;
  const phoneShell = (w, h, inner, bg = '#fff') => `<div style="width:${w}px;height:${h}px;border-radius:${w * .13}px;background:#121218;border:14px solid #2c2c36;box-shadow:0 0 0 8px #0b0b10,0 40px 80px rgba(0,0,0,.5);position:relative;overflow:hidden">
      <div style="position:absolute;inset:18px;border-radius:${w * .1}px;background:${bg};overflow:hidden">${inner}</div>
      <div style="position:absolute;top:30px;left:50%;transform:translateX(-50%);width:170px;height:42px;border-radius:21px;background:#000;z-index:3"></div></div>`;
  const avatar = (sz, base) => `<div style="width:${sz}px;height:${sz}px;border-radius:50%;overflow:hidden;background:#ffd1dc;border:5px solid ${INK};flex:none"><div style="margin:${sz * .06}px 0 0 ${-sz * .02}px">${person(base, { expr: 'happy' }).replace('width="300" height="420"', `width="${sz * 1.05}" height="${sz * 1.47}"`)}</div></div>`;

  // ───────── HUD: DIA 1/4 + CHANCE COM A BIA (value is a function of absolute time)
  const METER = t => t < 23.0 ? 3 : t < 30.6 ? 1 : t < 33.6 ? 1 + Math.round(4 * sm(30.6, 31.6, t)) : t < 45.6 ? 5 + Math.round(4 * sm(33.6, 34.4, t)) : 9 + Math.round(6 * sm(45.6, 46.6, t));
  function hud(s, enterAt = -1) {
    const root = s.el(`<div style="width:${W}px;height:300px"></div>`, { space: 'frame', x: 0, y: 0, anchor: 'top-left', layer: s.hud });
    root.innerHTML = `<div class="hudbox" style="left:40px;top:120px;width:260px;height:170px;text-align:center"><div class="hudlbl" style="margin-top:16px">DIA</div><div class="hudval" style="color:#ffc93c">1<span style="font-size:58px;color:#f1d6ff">/4</span></div></div>
      <div class="hudbox" style="left:330px;top:120px;width:710px;height:170px"><div class="hudlbl" style="position:absolute;left:34px;top:22px">CHANCE COM A BIA</div>
        <div class="hudval pct" style="position:absolute;left:34px;top:56px;color:#ff6fa5">3%</div>
        <div style="position:absolute;left:290px;top:92px;width:380px;height:40px;background:#120818;border-radius:20px;overflow:hidden"><div class="bar" style="height:100%;width:3%;background:#ff6fa5;border-radius:20px"></div></div></div>`;
    const pct = root.querySelector('.pct'), bar = root.querySelector('.bar');
    s.every(root, (lt, st) => { const t = s.start + lt, v = METER(t), drop = t > 23.0 && t < 24.6, up = (t > 30.6 && t < 31.8) || (t > 33.6 && t < 34.6) || (t > 45.6 && t < 46.8);
      pct.textContent = v + '%'; bar.style.width = Math.max(2, v * 2.5) + '%';
      const col = drop && Math.floor(t * 8) % 2 ? '#ff3b3b' : up && Math.floor(t * 8) % 2 ? '#7dff9a' : '#ff6fa5'; pct.style.color = col; bar.style.background = col;
      if (enterAt >= 0) { const e = sm(enterAt, enterAt + .35, lt); st.y -= (1 - e) * 320; } });
    return root;
  }
  // ───────── captions keyed to ABSOLUTE narration time
  function cap(s, at, dur, str, o = {}) {
    const t = s.text(str, { size: o.size || 15, space: 'frame', x: o.x || .5, y: o.y || .69, color: o.color || '#ffffff', css: 'font-family:Anton,sans-serif', layer: s.hud, minSize: 8 });
    t.classList.add('cap'); t.style.zIndex = 8; const l = at - s.start;
    s.anim(t, o.anim || 'pop', l, { cue: o.cue });
    s.every(t, (lt, st) => { st.o *= lt >= l && lt < l + dur ? 1 : 0; st.r += o.rot || 0; });
    return t;
  }
  const win = (s, a, b) => (lt, st) => { const t = s.start + lt; st.o *= t >= a && t < b ? 1 : 0; };

  // ═════════ 01 VISUALIZOU · 0–3.5 · the hook: seen, no answer
  C.scene('chat', 0, 3.5, s => {
    full(s, `<div style="width:100%;height:100%;background:radial-gradient(circle at 50% 40%, #7b2ff7, #3a0e6e 60%, #1a0533)"></div>`, .5);
    const ph = s.el(phoneShell(820, 1500, `
      <div style="height:200px;background:#f4f0fa;border-bottom:4px solid #ddd;display:flex;align-items:flex-end;gap:24px;padding:0 36px 24px">${avatar(110, BIA)}<div class="ui" style="font-size:56px">Bia<div style="font-size:30px;font-weight:500;color:#7a7a8a">online</div></div></div>
      <div style="position:absolute;right:36px;top:420px;max-width:600px;padding:30px 38px;border-radius:44px 44px 10px 44px;background:#7b2ff7;color:#fff;font:600 54px/1.15 Fredoka,sans-serif">oi bia! amanhã você vai pra escola?</div>
      <div class="seen ui" style="position:absolute;right:40px;top:600px;font-size:34px;color:#7a7a8a">Visualizada às 23:47</div>
      <div class="dots" style="position:absolute;left:36px;top:720px;padding:26px 34px;border-radius:44px 44px 44px 10px;background:#ece8f2;font:700 60px/1 Fredoka;color:#8a86a0;letter-spacing:8px">•••</div>`), { space: 'frame', x: .5, y: .5 });
    const seen = ph.querySelector('.seen'), dots = ph.querySelector('.dots');
    s.every(ph, (lt, st) => { st.y += (1 - sm(0, .3, lt)) * 300; st.s *= 1 + lt * .03; seen.style.opacity = lt > .9 ? 1 : 0; dots.style.opacity = lt > 1.5 && lt < 2.3 && Math.floor(lt * 5) % 2 ? 1 : lt > 1.5 && lt < 2.3 ? .5 : 0; });
    const d = bust(s, DAVI, { expr: 'sad', look: [-6, -6] }, 420, .82, 1.06);
    s.every(d, (lt, st) => { st.y += (1 - sm(1.9, 2.3, lt)) * 500; st.r += -8; });
    cap(s, .9, 1.25, 'VISUALIZOU...', { y: .63 });
    cap(s, 2.15, 1.35, 'E NÃO RESPONDEU', { y: .63, color: '#ff6fa5', size: 13 });
    C.cue(.9, 'tick', { gain: .6 }); C.cue(2.3, 'drop', { gain: .5 });
  }, { energy: .8, purpose: 'hook: left on seen' });

  // ═════════ 02 A FESTA · 3.5–9.3 · Saturday party, 4 days
  C.scene('festa', 3.5, 5.8, s => {
    full(s, `<div style="width:100%;height:100%;background:linear-gradient(#ff8fb8,#ffd1e3)"></div>`, .5);
    s.particles({ type: 'confetti', at: .3, x: .5, y: .3, count: 60, colors: ['#ffc93c', '#7b2ff7', '#43c6ac', '#ffffff'] });
    const b = bust(s, BIA, { expr: 'happy' }, 640, .5, 1.02);
    const bk = blink(b, .3); s.every(b, (lt, st) => { st.y += (1 - sm(0, .35, lt)) * 400; bk(lt); st.o *= lt < 2.9 ? 1 : 0; });
    const card = s.el(`<div class="ui" style="width:820px;padding:40px 46px;background:#fff;border:8px solid ${INK};border-radius:46px;box-shadow:0 14px 0 rgba(0,0,0,.35);text-align:center">
      <div style="font-size:40px;color:#7b2ff7">SÁBADO · 20H</div><div style="font:400 150px/1 Anton,sans-serif;color:#ff2e63;-webkit-text-stroke:6px ${INK};paint-order:stroke fill;margin:10px 0">16 DA BIA</div>
      <div style="font-size:40px;font-weight:500;color:#444">a festa mais esperada do ano</div></div>`, { space: 'frame', x: .5, y: .37 });
    s.anim(card, 'pop', .4); s.every(card, (lt, st) => { st.r += -3 + Math.sin(lt * 2) * 1.2; st.o *= lt < 2.9 ? 1 : 0; });
    // countdown strip: QUA QUI SEX SÁB
    const days = ['QUA', 'QUI', 'SEX', 'SÁB'];
    const strip = s.el(`<div style="display:flex;gap:22px">${days.map((d, i) => `<div class="ui day" style="width:200px;height:230px;border:7px solid ${INK};border-radius:30px;background:${i === 3 ? '#ff2e63' : '#fff'};text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.3)">
      <div style="font-size:40px;margin-top:22px;color:${i === 3 ? '#fff' : '#7b2ff7'}">${d}</div><div style="font:400 100px/1 Anton,sans-serif;color:${i === 3 ? '#fff' : INK};margin-top:8px">${i + 1}</div></div>`).join('')}</div>`, { space: 'frame', x: .5, y: .45 });
    const dn = strip.querySelectorAll('.day');
    s.every(strip, (lt, st) => { st.o *= lt >= 2.9 ? 1 : 0; dn.forEach((n, i) => { const k = sm(2.9 + i * .18, 3.1 + i * .18, lt); n.style.transform = `translateY(${(1 - k) * 200}px) scale(${.6 + .4 * k})`; n.style.opacity = k; }); });
    const dv = bust(s, DAVI, { expr: 'nervous', look: [4, -4] }, 520, .5, 1.04);
    s.every(dv, (lt, st) => { st.o *= lt >= 3.0 ? 1 : 0; st.y += (1 - sm(3.0, 3.4, lt)) * 500; });
    for (let i = 0; i < 4; i++) C.cue(3.5 + 2.9 + i * .18, 'pop', { gain: .45 });
    cap(s, 3.75, 1.2, 'SÁBADO', { y: .62 });
    cap(s, 5.0, 1.4, 'É A FESTA DELA', { y: .62, color: '#ffc93c', size: 13 });
    cap(s, 6.6, 1.2, '4 DIAS', { y: .6, color: '#ff2e63', size: 18 });
    cap(s, 7.8, 1.5, 'PRA ELA ME NOTAR', { y: .6, size: 13 });
    hud(s, .1);
  }, { energy: .9, purpose: 'the stakes: party on Saturday, 4 days' });

  // ═════════ 03 QUEM SOU · 9.3–16.2 · classroom, two desks behind her
  C.scene('davi', 9.3, 6.9, s => {
    full(s, classroom(), .6);
    const ex = (x, y, w, c) => { const n = bust(s, { skin: ['#c98a5e', '#6b4226', '#f0c09a'][c], hair: 'messy', hairC: ['#151515', '#5a3a22', '#e0b050'][c], top: ['#9b5de5', '#43c6ac', '#f4a261'][c], topType: 'tee' }, { expr: 'neutral', look: [0, 6] }, w, x, y); n.style.filter = 'saturate(.5) brightness(.95)'; return n; };
    ex(.18, .74, 250, 0); ex(.84, .74, 250, 1);
    const dv = bust(s, DAVI, { expr: 'smile', look: [2, 10] }, 300, .5, .745);
    s.el(`<div>${frameSvg(desk(540, 1250, 360) + desk(190, 1250, 340) + desk(890, 1250, 340))}</div>`, { space: 'frame', x: 0, y: 0, anchor: 'top-left' }).style.transform = 'translateY(-260px)';
    const mid = bust(s, { skin: '#d79a6c', hair: 'messy', hairC: '#d9a441', top: '#555b6e', topType: 'tee' }, { expr: 'neutral', look: [0, 6] }, 380, .2, .9); mid.style.filter = 'saturate(.4)';
    s.el(`<div>${frameSvg(desk(210, 1520, 460))}</div>`, { space: 'frame', x: 0, y: 0, anchor: 'top-left' }).style.transform = 'translateY(-180px)';
    const bia = bust(s, BIA, { expr: 'neutral', look: [0, 4] }, 520, .62, 1.05);
    s.el(`<div>${frameSvg(desk(660, 1700, 640))}</div>`, { space: 'frame', x: 0, y: 0, anchor: 'top-left' });
    const bkd = blink(dv, 1.2), bkb = blink(bia, .1);
    s.every(dv, (lt, st) => { st.y -= Math.abs(Math.sin(lt * 2.4)) * 6; bkd(lt); });
    s.every(bia, lt => bkb(lt));
    const arrow = s.el(`<div style="width:300px">${`<svg viewBox="0 0 300 300" width="300" height="300"><path d="M40 20 Q170 90 240 250" fill="none" stroke="#ff2e63" stroke-width="14" stroke-dasharray="26 18" stroke-linecap="round"/><path d="M200 236 L244 262 L250 212" fill="none" stroke="#ff2e63" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg>`}</div>`, { space: 'frame', x: .64, y: .5 });

  C.transition('festa', 'davi', { type: 'cut' });
  C.transition('davi', 'borracha', { type: 'zoom', intent: 'impact' });
  C.transition('borracha', 'kaique', { type: 'cut' });
  C.transition('kaique', 'vira', { type: 'whip', dir: 'up' });
  C.transition('vira', 'noite', { type: 'fade' });
  C.transition('noite', 'vibrou', { type: 'cut' });
  C.transition('vibrou', 'favor', { type: 'flash', color: '#ffffff' });
  C.transition('favor', 'fim', { type: 'cut' });
});
</script>
